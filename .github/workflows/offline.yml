# SPDX-License-Identifier: MIT
name: Offline development and package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential device-tree-compiler shellcheck debhelper dh-dkms python3-jsonschema
      - name: Offline contracts and host C tests
        run: make check
      - name: Validate exact development manifest schema
        run: |
          ./scripts/render-development-tree --source . --output /tmp/rp1-development-render --module-version 0.9.0
          python3 -c 'import json,jsonschema; jsonschema.Draft202012Validator(json.load(open("schema/rp1-gpclk-source-development-manifest-v1.schema.json"))).validate(json.load(open("/tmp/rp1-development-render/DEVELOPMENT_MANIFEST.json")))'
      - name: Reject silent Debian downgrade
        run: |
          if sh debian/rp1-gpclk-dkms.preinst upgrade 1.1.2-1 > /tmp/downgrade-result 2>&1; then exit 1; fi
          grep -q downgrade /tmp/downgrade-result
          sh debian/rp1-gpclk-dkms.preinst upgrade 0.9.0-1
      - name: Build unpublished development package
        run: dpkg-buildpackage -us -uc -b
      - name: Validate package version and ordering
        run: |
          test "$(dpkg-deb -f ../rp1-gpclk-dkms_0.9.0-1_all.deb Version)" = 0.9.0-1
          dpkg --compare-versions 0.9.0-1 lt 1.0.0-1
          dpkg --compare-versions 1.1.2-1 gt 0.9.0-1
